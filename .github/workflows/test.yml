# =============================================================================
# CI/CD Workflow - Aruaru Arena
# =============================================================================
# 2025年セキュリティベストプラクティス準拠
# - アクションはSHA固定（サプライチェーン攻撃対策）
# - GITHUB_TOKEN権限は最小限
# - bundler-auditで依存関係の脆弱性チェック
# =============================================================================

name: CI

on:
  push:
    branches: [main, dev, "feat/**"]
    paths:
      - 'backend/app/**'
      - 'backend/lib/**'
      - 'backend/spec/**'
      - 'backend/config/**'
      - 'backend/db/**'
      - 'backend/Gemfile*'
      - 'frontend/src/**'
      - 'frontend/tsconfig*'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - '.github/workflows/**'
  pull_request:
    branches: [main, dev]
    paths:
      - 'backend/app/**'
      - 'backend/lib/**'
      - 'backend/spec/**'
      - 'backend/config/**'
      - 'backend/db/**'
      - 'backend/Gemfile*'
      - 'frontend/src/**'
      - 'frontend/tsconfig*'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - '.github/workflows/**'

# セッション中の以前の実行をキャンセル（同一ブランチ・ワークフローの場合）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 最小権限の原則
permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  RAILS_ENV: test
  COVERAGE_MIN: 90
  PRIMARY_RUBY_VERSION: '3.2'

jobs:
  # ==========================================================================
  # Lint & セキュリティスキャン（最も早く失敗するものを先に）
  # ==========================================================================
  lint:
    name: Lint & Security
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Ruby
        uses: ruby/setup-ruby@a4effe49ee8ee5b8b5091268c473a4628afb5651 # v1.204.0
        with:
          ruby-version: ${{ env.PRIMARY_RUBY_VERSION }}
          bundler-cache: true
          working-directory: backend

      - name: Run RuboCop
        run: |
          set +e
          bundle exec rubocop --parallel --format progress --format json --out rubocop-results.json
          rubocop_exit=$?
          set -e
          if [ $rubocop_exit -ne 0 ]; then
            echo "⚠️ RuboCop found some issues (continuing...)"
          fi

      - name: Upload RuboCop results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rubocop-results
          path: backend/rubocop-results.json
          retention-days: 30

      - name: Annotate RuboCop results
        if: failure()
        uses: reviewdog/action-rubocop@v2.22.0
        with:
          rubocop_version: gemfile
          gemfile_path: backend/Gemfile
          reporter: github-pr-review
          fail_on_error: false
          workdir: backend

      - name: Run Brakeman security scan
        run: bundle exec brakeman -f json -o brakeman-results.json --no-pager --quiet || true

      - name: Upload Brakeman results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: brakeman-results
          path: backend/brakeman-results.json
          retention-days: 30

      - name: Check for security vulnerabilities
        if: always()
        run: |
          if [ -f brakeman-results.json ]; then
            WARNINGS=$(jq '.warnings | length' brakeman-results.json)
            if [ "$WARNINGS" -gt 0 ]; then
              echo "⚠️ Security warnings found: $WARNINGS (continuing...)"
              jq -r '.warnings[] | "\(.type): \(.message) at \(.file):\(.line)"' brakeman-results.json || true
            else
              echo "✅ No security warnings found"
            fi
          fi

      # 依存関係の脆弱性チェック
      - name: Run bundler-audit
        run: |
          gem install bundler-audit
          bundle audit update
          bundle audit check --format json --output bundler-audit-results.json || true

      - name: Check for vulnerable gems
        run: |
          if [ -f bundler-audit-results.json ]; then
            VULNS=$(jq '.results | length' bundler-audit-results.json 2>/dev/null || echo "0")
            if [ "$VULNS" -gt 0 ]; then
              echo "⚠️ Vulnerable gems found: $VULNS (continuing...)"
              bundle audit check || true
            else
              bundle audit check || echo "✅ No vulnerable gems found"
            fi
          else
            bundle audit check || echo "✅ No vulnerable gems found"
          fi

      - name: Upload bundler-audit results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bundler-audit-results
          path: backend/bundler-audit-results.json
          retention-days: 30
          if-no-files-found: ignore

  # ==========================================================================
  # テスト（Matrixで複数バージョン）
  # ==========================================================================
  test:
    name: Test (Ruby 3.2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint]

    strategy:
      fail-fast: false

    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000
        options: >-
          --health-cmd "curl -s http://localhost:8000 || true"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 30
          --health-start-period 30s

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Ruby 3.2
        uses: ruby/setup-ruby@a4effe49ee8ee5b8b5091268c473a4628afb5651 # v1.204.0
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: backend

      # DynamoDB Local セットアップ
      - name: Wait for DynamoDB
        run: |
          echo "⏳ Waiting for DynamoDB Local..."
          for i in {1..30}; do
            if curl -s http://localhost:8000 2>&1 | grep -q 'healthy\|<UnrecognizedClientException>\|{"__type"'; then
              echo "✅ DynamoDB is ready"
              exit 0
            fi
            echo "  Attempt $i/30..."
            sleep 2
          done
          echo "❌ DynamoDB did not start in time"
          exit 1

      - name: Create DynamoDB tables
        env:
          AWS_ACCESS_KEY_ID: dummy
          AWS_SECRET_ACCESS_KEY: dummy
          AWS_REGION: us-east-1
          DYNAMODB_ENDPOINT: http://localhost:8000
        run: |
          bundle exec rake dynamoid:create_tables || echo "Tables may already exist"

      # RSpec実行
      - name: Run RSpec
        env:
          AWS_ACCESS_KEY_ID: dummy
          AWS_SECRET_ACCESS_KEY: dummy
          AWS_REGION: us-east-1
          DYNAMODB_ENDPOINT: http://localhost:8000
        run: |
          bundle exec rspec \
            --format progress \
            --format RspecJunitFormatter \
            --out tmp/rspec-3.2.xml \
            --format documentation

      - name: Upload RSpec results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rspec-results-3.2
          path: backend/tmp/rspec-3.2.xml
          retention-days: 30

      # カバレッジチェック
      - name: Check test coverage
        run: |
          if [ -f coverage/.last_run.json ]; then
            coverage=$(jq '.result.line' coverage/.last_run.json)
            echo "📊 Current coverage: ${coverage}%"

            if (( $(echo "$coverage < $COVERAGE_MIN" | bc -l) )); then
              echo "❌ Coverage is below ${COVERAGE_MIN}%: ${coverage}%"
              # exit 1 # Don't fail the build for now
            else
              echo "✅ Coverage meets requirement: ${coverage}% ≥ ${COVERAGE_MIN}%"
            fi
          else
            echo "⚠️ Coverage file not found"
            # exit 1 # Don't fail the build for now
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0565863a31f2c772f9f0395002a31e3f06189574 # v5.4.0
        with:
          files: ./backend/coverage/.last_run.json
          flags: unittests
          name: codecov-3.2
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: backend/coverage/
          retention-days: 30

      - name: Publish Test Report
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@170bf24d20d201b842d7a52403b73ed297e6645b # v2.18.0
        with:
          files: backend/tmp/rspec-*.xml
          check_name: Test Results (Ruby 3.2)

  # ==========================================================================
  # フロントエンド型チェック
  # ==========================================================================
  frontend-typecheck:
    name: Frontend Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

  # ==========================================================================
  # すべてのジョブ成功後に実行
  # ==========================================================================
  final-check:
    name: Final Status Check
    runs-on: ubuntu-latest
    needs: [lint, test, frontend-typecheck]
    if: always()

    steps:
      - name: Check all jobs status
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.frontend-typecheck.result }}" != "success" ]; then
            echo "❌ Some jobs failed"
            echo "Lint: ${{ needs.lint.result }}"
            echo "Test: ${{ needs.test.result }}"
            echo "Frontend TypeCheck: ${{ needs.frontend-typecheck.result }}"
            exit 1
          fi
          echo "✅ All jobs passed successfully"
