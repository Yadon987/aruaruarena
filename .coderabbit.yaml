# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "ja-JP"
early_access: false

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true

  auto_review:
    enabled: true
    drafts: false
    ignore_title_keywords:
      - "WIP"
      - "Draft"
      - "Don't merge"
      - "[WIP]"
      - "Draft:"
      - "Work in progress"

  # パスフィルタ：レビュー対象を明確化し、誤検知を削減
  path_filters:
    - ".coderabbit.yaml"
    - "app/**/*"
    - "frontend/**/*"
    - "lib/**/*"
    - "spec/**/*"
    - "config/**/*"
    - "db/**/*"
    - "test/**/*"
    - "docs/**/*.md"
    - "README.md"
    - "!vendor/**/*"
    - "!db/schema.rb"
    - "!node_modules/**/*"
    - "!public/**/*"
    - "!**/CHANGELOG*"
    - "!.git/**/*"
    - "!*.log"
    - "AGENTS.md"

  # 知識ベース：プロジェクト固有のドキュメントを参照
  knowledge_base:
    include:
      - "docs/**/*.md"
      - "README.md"
      - ".rubocop.yml"
      - "Gemfile"
      - ".ruby-version"

  tools:
    rubocop:
      enabled: true
    brakeman:
      enabled: true
    rspec:
      enabled: true

chat:
  auto_reply: true
